<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliê Mari — Área de Membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#B23A56;
    --pink-dark:#8F2C44;
    --pink-light:#F3D7DA;
    --pink-lighter:#FBEEEF;
    --bg:#F7F1E8;
    --card:#FFFFFF;
    --ink:#1B2A4C;
    --ink-soft:#5F6B85;
    --ink-faint:#A7AFC0;
    --white:#FFFFFF;
    --green:#2FAE6B;
    --shadow-sm:0 4px 14px rgba(27,42,76,.08);
    --shadow-md:0 10px 30px rgba(27,42,76,.12);
    --shadow-card:0 10px 22px rgba(27,42,76,.08);
    --radius-lg:26px;
    --radius-md:20px;
    --radius-sm:14px;
    --radius-pill:999px;
    --font-serif:'Caveat', cursive;
    --font-sans:'Lora', Georgia, serif;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-sans); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; border:none; background:none; cursor:pointer;}
  ul{margin:0; padding:0; list-style:none;}
  p{margin:0;}
  h1,h2,h3{font-family:var(--font-serif); font-weight:700; margin:0; color:var(--ink);}

  .shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar (desktop) ---------- */
  .sidebar{
    display:none;
    width:var(--sidebar-w); flex:0 0 auto;
    background:var(--white); border-right:1px solid var(--pink-light);
    padding:28px 20px; position:sticky; top:0; height:100vh;
    flex-direction:column;
  }
  .sidebar-brand{margin-bottom:34px; padding-left:6px;}
  .sidebar-brand .eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--pink-dark); text-transform:uppercase;}
  .sidebar-brand h1{font-size:30px; margin-top:2px;}
  .sidebar-nav{display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:flex-start; gap:12px;
    padding:11px 14px; border-radius:var(--radius-sm);
    font-weight:700; font-size:13.5px; line-height:1.35; color:var(--ink-soft);
    transition:background .15s, color .15s;
  }
  .nav-item:hover{background:var(--pink-lighter);}
  .nav-item.active{background:var(--pink); color:var(--white);}
  .nav-item .nav-icon{width:20px; height:20px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .nav-item.active .nav-icon svg{stroke:var(--white); color:var(--white);}

  /* ---------- Main content ---------- */
  main.content{
    flex:1; min-width:0;
    max-width:760px; margin:0 auto;
    padding:22px 20px 100px;
  }
  main.content.wide{max-width:900px;}

  /* ---------- Bottom tabs (mobile) ---------- */
  .bottom-tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--white); border-top:1px solid var(--pink-light);
    display:flex; justify-content:space-around; padding:8px 4px 10px;
  }
  .tab-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:10.5px; font-weight:700;
    padding:4px 6px; border-radius:10px; flex:1;
  }
  .tab-item.active{color:var(--pink-dark);}
  .tab-item .tab-icon{width:20px; height:20px;}
  .tab-item .tab-icon svg{stroke:currentColor;}

  @media (min-width:880px){
    .sidebar{display:flex;}
    .bottom-tabs{display:none;}
    main.content{padding:40px 40px 60px; margin:0; max-width:640px;}
    main.content.wide{max-width:820px;}
  }

  .brand-footer{
    margin-top:auto; padding-top:20px;
    display:flex; align-items:center; gap:8px; justify-content:center;
    color:var(--pink-dark);
  }
  .brand-footer .rule{flex:1; height:1px; background:var(--pink-light);}
  .brand-footer .brand-name{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; color:var(--pink-dark);}
  .brand-footer .brand-flower{flex:0 0 auto; display:flex;}

  /* ---------- Hero ---------- */
  .hero-card{
    position:relative; overflow:hidden;
    background:var(--pink-light);
    background-image:radial-gradient(rgba(178,58,86,.10) 1.5px, transparent 1.5px);
    background-size:16px 16px;
    border-radius:var(--radius-lg);
    padding:30px 26px 34px;
    color:var(--ink);
    margin-bottom:30px;
  }
  .hero-eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--pink-dark); margin-bottom:6px;}
  .hero-title{font-size:clamp(32px,8vw,42px); color:var(--ink); line-height:1.1; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hero-title .heart{color:var(--pink); flex:0 0 auto;}
  .hero-underline{width:120px; height:8px; margin:6px 0 4px;}
  .hero-tagline{font-family:var(--font-serif); font-size:19px; color:var(--ink-soft); margin-top:6px;}

  /* ---------- Section title ---------- */
  .section-label{font-family:var(--font-serif); font-size:23px; font-weight:700; margin-bottom:12px;}

  /* ---------- Access cards (reuses quiz choice-card language) ---------- */
  .access-list{display:flex; flex-direction:column; gap:12px; margin-bottom:26px;}
  .access-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border-radius:var(--radius-md);
    padding:14px 16px; box-shadow:var(--shadow-card);
    text-align:left; transition:transform .12s, box-shadow .12s;
  }
  .access-card:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .access-icon{
    width:44px; height:44px; flex:0 0 auto; border-radius:50%;
    background:var(--pink-dark); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .access-icon.light{background:var(--pink-light); color:var(--pink-dark);}
  .access-body{flex:1; min-width:0;}
  .access-title{font-weight:700; font-size:15px; color:var(--ink);}
  .access-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
  .access-arrow{color:var(--pink); font-size:16px; flex:0 0 auto;}

  /* ---------- Ritual box ---------- */
  .ritual-box{
    background:var(--pink-lighter); border:1px solid var(--pink-light);
    border-radius:var(--radius-md); padding:18px 20px;
  }
  .ritual-title{font-family:var(--font-serif); font-weight:700; font-size:23px; color:var(--pink-dark); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .ritual-text{font-size:13.5px; line-height:1.6; color:var(--ink);}

  /* ---------- Page header (secondary views) ---------- */
  .page-header{margin-bottom:24px;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; color:var(--ink-soft);
    margin-bottom:14px;
  }
  .page-eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--pink-dark); text-transform:uppercase; margin-bottom:6px;}
  .page-title{font-size:clamp(28px,6.5vw,36px);}
  .page-sub{font-size:14px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}

  /* ---------- Generic list card (lessons, modules) ---------- */
  .item-list{display:flex; flex-direction:column; gap:12px;}
  .item-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border-radius:var(--radius-md);
    padding:14px; box-shadow:var(--shadow-card);
  }
  .item-thumb{
    width:56px; height:56px; flex:0 0 auto; border-radius:14px;
    background:linear-gradient(150deg,var(--pink-light),#f7c9dd);
    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--pink-dark);
  }
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:700; font-size:14.5px;}
  .item-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .item-check{
    width:26px; height:26px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  .item-check.done{background:var(--green); color:var(--white);}
  .item-check.todo{border:1.5px solid var(--pink-light); color:transparent;}

  /* ---------- Module card (curso / trilha) ---------- */
  .module-card{
    display:flex; gap:14px; align-items:flex-start;
    width:100%; text-align:left;
    background:var(--card); border-radius:var(--radius-md);
    padding:16px; box-shadow:var(--shadow-card);
    transition:transform .12s, box-shadow .12s;
  }
  .module-card:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .lesson-list{display:flex; flex-direction:column; gap:22px;}
  .lesson-block{background:var(--card); border-radius:var(--radius-md); box-shadow:var(--shadow-card); padding:20px 22px;}
  .lesson-title{font-family:var(--font-serif); font-weight:700; font-size:23px; color:var(--pink-dark); margin-bottom:8px;}
  .lesson-text{font-size:14px; line-height:1.75; color:var(--ink);}
  .video-embed{position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; background:#000;}
  .video-embed iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .module-num{
    width:30px; height:30px; border-radius:50%; flex:0 0 auto;
    background:var(--pink-dark); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; margin-top:1px;
  }
  .module-title{font-family:var(--font-serif); font-weight:700; font-size:22px; color:var(--pink-dark);}
  .module-desc{display:block; font-size:13px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
  .module-meta{display:block; font-size:11.5px; color:var(--ink-faint); font-weight:700; margin-top:8px;}

  /* ---------- Progress bar ---------- */
  .progress-block{margin-bottom:24px;}
  .progress-label{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;}
  .progress-track{height:8px; background:var(--pink-light); border-radius:var(--radius-pill); overflow:hidden;}
  .progress-fill{height:100%; background:var(--pink); border-radius:var(--radius-pill);}

  /* ---------- Chips (filters) ---------- */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 16px; border-radius:var(--radius-pill);
    background:var(--card); border:1px solid var(--pink-light);
    font-size:12.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap;
  }
  .chip.active{background:var(--pink); border-color:var(--pink); color:var(--white);}

  /* ---------- Grid (moldes) ---------- */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  @media (min-width:600px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:880px){ .grid{grid-template-columns:repeat(4,1fr);} }
  .grid-card{
    display:block; background:var(--card); border-radius:var(--radius-md);
    box-shadow:var(--shadow-card); overflow:hidden;
    transition:transform .12s, box-shadow .12s;
  }
  .grid-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .grid-thumb{
    aspect-ratio:1/1; background:linear-gradient(150deg,var(--pink-light),#f7c9dd);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--pink-dark);
  }
  .grid-thumb-link{display:block;}
  .grid-thumb.img{background:var(--pink-lighter); padding:10px; position:relative; overflow:hidden;}
  .grid-thumb.img img{width:100%; height:100%; object-fit:contain;}
  .watermark{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-28deg);
    font-family:var(--font-serif); font-size:15px; font-weight:700;
    color:var(--ink); opacity:.16;
    white-space:nowrap; pointer-events:none; user-select:none;
  }
  .grid-card-body{padding:10px 12px 12px;}
  .grid-label{font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:8px;}
  .download-btn{
    display:flex; align-items:center; justify-content:center; gap:5px;
    width:100%; padding:8px 10px; border-radius:var(--radius-pill);
    background:var(--pink); color:var(--white);
    font-size:12px; font-weight:700; letter-spacing:.01em;
    transition:background .15s, transform .12s;
  }
  .download-btn:hover{background:var(--pink-dark); transform:translateY(-1px);}

  /* ---------- Palette cards ---------- */
  .search-input{
    width:100%; padding:13px 18px; border-radius:var(--radius-pill);
    border:1px solid var(--pink-light); background:var(--card);
    font-family:var(--font-sans); font-size:13.5px; color:var(--ink);
    margin-bottom:16px; outline:none;
  }
  .search-input:focus{border-color:var(--pink);}
  .palette-list{display:flex; flex-direction:column; gap:10px;}
  .palette-row{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--pink-light);
    border-radius:var(--radius-md); padding:13px 16px;
  }
  .palette-row-num{font-size:11.5px; font-weight:700; color:var(--ink-faint); flex:0 0 auto; width:20px;}
  .palette-row-swatches{display:flex; gap:4px; flex:0 0 auto;}
  .swatch-dot{width:16px; height:16px; border-radius:50%; border:1px solid rgba(0,0,0,.06);}
  .palette-row-body{flex:1; min-width:0;}
  .palette-row-name{font-family:var(--font-sans); font-weight:700; font-size:14.5px; color:var(--ink);}
  .palette-row-desc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .fav-star{font-size:18px; color:var(--pink-light); flex:0 0 auto;}
  .fav-star.active{color:var(--pink);}
  .empty-state{font-size:13.5px; color:var(--ink-soft); text-align:center; padding:30px 0;}

  /* ---------- Accordion (erros) ---------- */
  .faq-item{background:var(--card); border:1px solid var(--pink-light); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:10px;}
  .faq-q{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; font-weight:700; font-size:14px; text-align:left;}
  .faq-q .chev{color:var(--pink); font-size:12px; transition:transform .2s;}
  .faq-item.open .faq-q .chev{transform:rotate(180deg);}
  .faq-a{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .faq-a-inner{padding:0 16px 15px; font-size:13px; line-height:1.6; color:var(--ink-soft);}
  .faq-a-inner .fix{color:var(--green); font-weight:700;}

  /* ---------- Materiais two-column ---------- */
  .materiais-cols{display:grid; grid-template-columns:1fr; gap:16px;}
  @media (min-width:600px){ .materiais-cols{grid-template-columns:1fr 1fr;} }
  .materiais-box{background:var(--card); border-radius:var(--radius-md); box-shadow:var(--shadow-card); padding:18px;}
  .materiais-box h3{font-size:14.5px; margin-bottom:12px;}
  .materiais-box.avoid h3{color:var(--pink-dark);}
  .materiais-box ul{display:flex; flex-direction:column; gap:9px;}
  .materiais-box li{display:flex; gap:8px; font-size:13.5px; color:var(--ink);}

  /* ---------- Perfil ---------- */
  .profile-avatar{
    width:76px; height:76px; border-radius:50%; background:var(--pink-light);
    color:var(--pink-dark); display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-size:26px; font-weight:700; margin-bottom:14px;
  }
  .profile-email{font-size:14px; color:var(--ink-soft); margin-bottom:24px;}
  .profile-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border-radius:var(--radius-md); box-shadow:var(--shadow-card);
    padding:15px 16px; margin-bottom:10px; font-weight:700; font-size:14px;
  }
  .profile-row .arrow{color:var(--pink); font-size:15px;}
  .profile-row.danger{color:var(--pink-dark);}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="eyebrow">Ateliê Mari</div>
      <h1>Meu espaço</h1>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="brand-footer">
      <span class="rule"></span>
      <span class="brand-flower">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="6" r="2.6" fill="currentColor" opacity=".55"/><circle cx="17" cy="9.5" r="2.6" fill="currentColor" opacity=".55"/><circle cx="15" cy="16" r="2.6" fill="currentColor" opacity=".55"/><circle cx="9" cy="16" r="2.6" fill="currentColor" opacity=".55"/><circle cx="7" cy="9.5" r="2.6" fill="currentColor" opacity=".55"/></svg>
      </span>
      <span class="brand-name">Mari Nonaka</span>
      <span class="rule"></span>
    </div>
  </aside>

  <main class="content" id="content"></main>

  <nav class="bottom-tabs" id="bottomTabs"></nav>
</div>

<script>
/* ================= Icons ================= */
function icon(name){
  var icons = {
    play:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 4l13 8-13 8V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    home:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    stitch:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M4 6l16 12M20 6L4 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    diamond:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 9-9 9-9-9 9-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    palette:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/></svg>',
    person:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.6-3.6 4.8-5.5 7.5-5.5s5.9 1.9 7.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    warning:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4l9 16H3L12 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>',
    check:'<svg width="12" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5l3.5 3.5L12 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    heart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7.5-4.6-10-9.3C.4 7.2 2.3 4 5.6 4c2 0 3.6 1.1 4.4 2.7C10.8 5.1 12.4 4 14.4 4c3.3 0 5.2 3.2 3.6 6.7C15.5 15.4 12 20 12 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    bulb:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M8 14a5 5 0 117.9 0c-.7.9-1.4 1.7-1.4 2.8H9.5c0-1.1-.7-1.9-1.5-2.8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    flower:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="6" r="2.6" fill="currentColor" opacity=".55"/><circle cx="17" cy="9.5" r="2.6" fill="currentColor" opacity=".55"/><circle cx="15" cy="16" r="2.6" fill="currentColor" opacity=".55"/><circle cx="9" cy="16" r="2.6" fill="currentColor" opacity=".55"/><circle cx="7" cy="9.5" r="2.6" fill="currentColor" opacity=".55"/></svg>'
  };
  return icons[name] || '';
}

/* ================= Nav config ================= */
var NAV_MOBILE = [
  { id:'videos',   label:'Vídeos',   icon:'play' },
  { id:'inicio',   label:'Início',   icon:'home' },
  { id:'aprender', label:'Aprender', icon:'stitch' },
  { id:'moldes',   label:'Moldes',   icon:'diamond' },
  { id:'paletas',  label:'Paletas',  icon:'palette' },
  { id:'perfil',   label:'Perfil',   icon:'person' }
];

var NAV_DESKTOP = [
  { id:'inicio',   label:'Início',                             icon:'home' },
  { id:'videos',   label:'Vídeo Aulas',                        icon:'play' },
  { id:'aprender', label:'Aprenda Bordado Japonês',            icon:'stitch' },
  { id:'paletas',  label:'30 Paletas de Cores Profissionais',  icon:'palette' },
  { id:'erros',    label:'Guia de Erros e Correções',          icon:'warning' },

      '<span class="nav-icon">' + icon(item.icon) + '</span>' + item.label +
    '</button>';
  }).join('');

  var bottomTabs = document.getElementById('bottomTabs');
  bottomTabs.innerHTML = NAV_MOBILE.map(function(item){
    return '<button class="tab-item' + (item.id === currentView ? ' active' : '') + '" data-view="' + item.id + '">' +
      '<span class="tab-icon">' + icon(item.icon) + '</span>' + item.label +
    '</button>';
  }).join('');

  document.querySelectorAll('[data-view]').forEach(function(el){
    el.addEventListener('click', function(){ goToView(el.getAttribute('data-view')); });
  });
}

function goToView(id){
  currentView = id;
  renderShell();
  var content = document.getElementById('content');
  content.className = 'content' + (VIEW_WIDE[id] ? ' wide' : '');
  content.innerHTML = VIEWS[id] ? VIEWS[id]() : '';
  bindView(id);
  window.scrollTo({top:0, behavior:'instant'});
}

var MODULES = [
  { title:'Boas-vindas', desc:'Uma carta de abertura da Mari e um convite para começar sem pressa.', aulas:[
    { title:'Uma carta da Mari', content:'Que bom ter você aqui. Se você chegou até esse curso, é porque em algum momento uma peça de Sashiko te parou — talvez pelas linhas brancas sobre o azul-índigo, talvez pela ideia de fazer algo com as próprias mãos, devagar, sem pressa. Eu quero te dizer uma coisa antes de começarmos: você não precisa saber bordar. Não precisa ter pulso firme, nem paciência de monge, nem talento artístico. O Sashiko foi criado por pessoas comuns, remendando roupas de trabalho — não por artistas. Ele é, antes de tudo, um ofício de repetição. E repetição, qualquer uma de nós consegue aprender.' },
    { title:'Como funciona esse espaço', content:'Esse curso está organizado em 10 módulos, na ordem em que faz mais sentido aprender: primeiro a história e os materiais, depois a preparação do tecido, os pontos básicos, os padrões e, por fim, os projetos práticos e o acabamento. Você pode assistir e ler tudo na ordem, ou pular direto para o que precisar — por exemplo, se você já tem experiência com costura, pode ir direto para os pontos e padrões. Não existe prazo. Volte quantas vezes quiser em qualquer módulo.' },
    { title:'Seu compromisso com você mesma', content:'A única coisa que peço é que você não busque a perfeição na primeira peça. O primeiro pano que você bordar vai ter pontos desiguais, e está certo que seja assim — é dele que você vai aprender o ritmo da sua própria mão. Guarde essa primeira peça, mesmo torta. Daqui a alguns meses, quando comparar com o que estiver fazendo, ela vai te mostrar o quanto você caminhou.' }
  ]},
  { title:'História do Sashiko', desc:'De onde vem essa técnica, o que ela significa e por que ela transforma quem borda.', aulas:[
    { title:'De onde vem o Sashiko', content:'Sashiko (刺し子, "pequenas perfurações") nasceu no Japão rural, entre os séculos XVII e XIX, em regiões de invernos rigorosos como Tōhoku. Tecido era caro e escasso, então famílias de agricultores e pescadores usavam pontos simples e repetidos para reforçar roupas de trabalho, sobrepor camadas de pano fino e ganhar mais calor e resistência. Não era decoração — era necessidade. Com o tempo, o que começou como remendo funcional foi ganhando padrões geométricos transmitidos de mãe para filha, cada região desenvolvendo seus próprios desenhos.' },
    { title:'O que o Sashiko significa', content:'Existe uma ideia japonesa chamada "mottainai" — o desconforto de desperdiçar algo que ainda tem valor. O Sashiko nasce exatamente desse espírito: transformar o que já existe (um tecido gasto, uma roupa rasgada) em algo mais forte e, com o tempo, mais bonito. É por isso que tantas pessoas descrevem o Sashiko como algo que "acalma" — não é só o ato repetitivo de bordar, é a lógica por trás dele: cuidar de algo aos poucos, ponto a ponto, sem pressa de terminar.' }
  ]},
  { title:'Materiais essenciais', desc:'Tudo o que você precisa (e o que não precisa) para começar.', aulas:[
    { title:'Tecido — o que usar', content:'O tecido tradicional é o algodão de trama média, como o algodão cru, o "sarja leve" ou o linho fino — eles seguram bem o ponto sem esgarçar. Evite tecidos muito elásticos (como malha) ou muito sintéticos e escorregadios no início, porque dificultam ver e manter o ponto reto. Uma boa opção pra começar é um retalho de algodão liso, de cor escura (índigo, verde-musgo, marrom) — as cores escuras deixam a linha branca bem visível enquanto você aprende.' },
    { title:'Linha e agulha', content:'A linha de Sashiko é mais grossa e um pouco mais rígida que a linha de bordado comum — isso ajuda a manter os pontos uniformes. Se não encontrar linha específica, uma linha de algodão para crochê fina também funciona bem no início. A agulha de Sashiko é mais longa que uma agulha comum, com um olhal maior — facilita passar a linha grossa e "correr" vários pontos de uma vez antes de puxar, que é a técnica clássica do Sashiko.' },
    { title:'Bastidor e o que não precisa', content:'Um bastidor de madeira simples, de 15 a 20cm, já é suficiente — ele mantém o tecido esticado e uniforme enquanto você borda. Você também vai precisar de uma tesourinha de ponta fina e, se possível, um lápis ou giz de alfaiate para marcar o desenho. O que você não precisa: máquina de costura, aro grande de bordado profissional, ou qualquer kit caro de "iniciante" — o Sashiko tradicional é propositalmente simples.' }
  ]},
  { title:'Preparação do tecido', desc:'Como cortar, lavar, marcar o molde e preparar o bastidor.', aulas:[
    { title:'Cortando e lavando o tecido', content:'Antes de bordar, lave e passe o tecido — isso remove o amido de fábrica (que dificulta a agulha) e evita que a peça encolha depois de pronta. Corte o tecido sempre um pouco maior do que o tamanho final da peça (uns 3 a 5cm de sobra em cada lado), porque o bastidor precisa de margem para prender, e você vai aparar o excesso só no final.' },
    { title:'Marcando o molde e preparando o bastidor', content:'Para transferir o molde, você pode usar papel-carbono próprio para tecido, ou simplesmente um lápis bem apontado se o desenho for geométrico e você usar régua. Centralize o desenho no tecido antes de prender no bastidor. Ao encaixar no bastidor, puxe o tecido igualmente pelos quatro lados — ele deve ficar esticado como um tambor, sem estar tão apertado a ponto de distorcer a trama.' }
  ]},
  { title:'Pontos básicos', desc:'O ponto reto do Sashiko, ritmo, tensão e uniformidade.', aulas:[
    { title:'Ponto Básico', type:'video', videoId:'uc6kHJV1gEk' },
    { title:'O ponto reto do Sashiko', content:'O ponto do Sashiko é, na essência, um ponto corrido (para frente), com pontos e espaços de tamanho igual — geralmente entre 3 e 5mm cada. A diferença para um ponto corrido comum é a consistência: no Sashiko tradicional, "corre-se" a agulha por vários pontos de uma vez, entrando e saindo do tecido em sequência, antes de puxar a linha toda de uma vez.' },
    { title:'Ritmo e tensão', content:'A tensão certa é aquela que deixa a linha assentar sobre o tecido sem esticar (o que franze o pano) nem ficar frouxa (o que deixa a linha "boiando"). O segredo é puxar a linha sempre na mesma direção e com a mesma força, encontrando um ritmo — muita gente descreve esse momento como o mais relaxante do processo, quase meditativo.' },
    { title:'Uniformidade', content:'Para manter os pontos do mesmo tamanho, muitas bordadeiras usam o próprio tecido como guia, contando os fios da trama, ou marcam pontos-guia a lápis nas primeiras peças. Não se cobre por uniformidade perfeita logo de início — ela vem com a repetição, não com esforço.' }
  ]},
  { title:'Primeiros exercícios', desc:'Linhas retas, grade e curvas — a base de tudo.', aulas:[
    { title:'Linhas retas', content:'Comece bordando linhas retas simples, de ponta a ponta do tecido, sem nenhum padrão ainda. O objetivo aqui não é o resultado, é treinar a mão a manter o espaçamento entre pontos. Faça isso por pelo menos uma linha inteira antes de avançar.' },
    { title:'Grade', content:'O próximo passo é cruzar linhas retas horizontais e verticais, formando uma grade — essa é a base geométrica da maioria dos padrões clássicos de Sashiko, incluindo o Asanoha que você vai ver no módulo 7.' },
    { title:'Curvas', content:'Curvas exigem pontos um pouco menores e mais próximos entre si para acompanhar a linha sem ficar "quadrada". Pratique com uma curva simples, tipo uma onda, antes de partir para padrões com curvas de verdade.' }
  ]},
  { title:'Padrões geométricos clássicos', desc:'Asanoha, hitomezashi, moyouzashi.', aulas:[
    { title:'Asanoha e Hitomezashi', content:'Asanoha ("folha de cânhamo") é talvez o padrão mais reconhecido do Sashiko: uma grade de hexágonos divididos em estrelas de seis pontas, tradicionalmente usado em roupas de bebê por representar crescimento saudável e rápido, como a planta de cânhamo. Hitomezashi ("um ponto") é a técnica mais simples de todas: pontos únicos, alinhados em grade, que combinados formam desenhos maiores — é o melhor padrão para quem está começando.' },
    { title:'Moyouzashi', content:'Moyouzashi é a técnica usada para padrões mais fluidos e contínuos, onde a linha "corre" por trajetos mais longos antes de repetir. É um pouco mais avançada que o Hitomezashi, mas o resultado visual é mais orgânico — vale praticar depois de já estar confortável com grades simples.' }
  ]},
  { title:'Ondas e curvas', desc:'Seigaiha e movimentos fluidos.', aulas:[
    { title:'Seigaiha', content:'Seigaiha ("ondas do mar azul") é um padrão de meio-círculos sobrepostos, lembrando ondulações do mar — um dos motivos mais antigos e usados em toda a arte têxtil japonesa, não só no Sashiko. Ele representa calma e boa sorte contínua, como ondas que se repetem sem fim.' },
    { title:'Movimentos fluidos', content:'Depois de dominar o Seigaiha isolado, você pode combiná-lo com outros padrões de curva para criar composições mais ricas — por exemplo, ondas ao fundo com uma flor de cerejeira sobreposta. Esse é um bom exercício de transição antes dos projetos práticos do próximo módulo.' }
  ]},
  { title:'Projetos práticos', desc:'Do primeiro pano à almofada finalizada.', aulas:[
    { title:'Seu primeiro pano', content:'Escolha um padrão simples (Hitomezashi ou Asanoha) e borde um quadrado de 15x15cm do início ao fim. Esse será seu primeiro projeto completo — guarde-o, mesmo com imperfeições, como registro do seu ponto de partida.' },
    { title:'Transformando em almofada', content:'Com o quadrado bordado pronto, você pode transformá-lo na frente de uma capa de almofada simples, costurando um tecido liso como parte de trás e um zíper ou fechamento de botões.' },
    { title:'Do rascunho ao projeto finalizado', content:'Reveja o que aprendeu nos módulos anteriores para planejar um segundo projeto, agora escolhendo você mesma o padrão, o tamanho e a cor — esse é o momento de aplicar o que virou repertório seu.' }

var moldesCategoria = 'Todos';
var moldesFiltro = '';

VIEWS.moldes = function(){
  var categorias = ['Todos'].concat(Array.from(new Set(MOLDES.map(function(m){ return m.cat; }))));
  return pageHeader('Biblioteca de Moldes', MOLDES.length + ' moldes prontos para imprimir, transferir e bordar, organizados por categoria.') +
    '<input class="search-input" id="moldeSearch" type="text" placeholder="Buscar molde pelo nome..." value="' + moldesFiltro + '">' +
    '<div class="chip-row">' +
      categorias.map(function(c){ return '<span class="chip' + (c === moldesCategoria ? ' active' : '') + '" data-cat="' + c + '">' + c + '</span>'; }).join('') +
    '</div>' +
    '<div class="grid" id="moldesGrid"></div>';
};

function renderMoldesGrid(){
  var termo = moldesFiltro.toLowerCase();
  var lista = MOLDES.filter(function(m){
    var matchesCat = moldesCategoria === 'Todos' || m.cat === moldesCategoria;
    var matchesTermo = m.nome.toLowerCase().indexOf(termo) > -1;
    return matchesCat && matchesTermo;
  });
  var gridEl = document.getElementById('moldesGrid');
  if(!gridEl) return;
  if(lista.length === 0){
    gridEl.innerHTML = '<p class="empty-state">Nenhum molde encontrado.</p>';
    return;
  }
  gridEl.innerHTML = lista.map(function(m){
    var filename = m.slug + '-' + m.nome.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
    return '<div class="grid-card">' +
      '<a class="grid-thumb-link" href="' + m.url + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="grid-thumb img">' +
          '<img src="' + m.img + '" alt="' + m.nome + '" loading="lazy">' +
          '<span class="watermark">Ateliê Mari</span>' +
        '</div>' +
      '</a>' +
      '<div class="grid-card-body">' +
        '<span class="grid-label" style="display:block;">' + m.nome + '</span>' +
        '<a class="download-btn" href="' + m.img + '" download="' + filename + '" target="_blank" rel="noopener noreferrer">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v13m0 0l-5-5m5 5l5-5M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          ' Baixar' +
        '</a>' +
      '</div>' +
    '</div>';
  }).join('');
}

var favoritos = {};
var paletaFiltro = '';
var paletaAba = 'todos';

VIEWS.paletas = function(){
  return pageHeader('Paletas', '30+ combinações profissionais para inspirar sua próxima peça.') +
    '<input class="search-input" id="paletaSearch" type="text" placeholder="Buscar por nome, sensação ou categoria..." value="' + paletaFiltro + '">' +
    '<div class="chip-row">' +
      '<span class="chip' + (paletaAba === 'todos' ? ' active' : '') + '" data-aba="todos">Todos</span>' +
      '<span class="chip' + (paletaAba === 'favoritos' ? ' active' : '') + '" data-aba="favoritos">★ Favoritos</span>' +
    '</div>' +
    '<div class="palette-list" id="paletaList"></div>';
};

function renderPaletaList(){
  var termo = paletaFiltro.toLowerCase();
  var lista = PALETAS.map(function(p, i){ return { p:p, i:i }; }).filter(function(item){
    var matchesTermo = item.p.name.toLowerCase().indexOf(termo) > -1 || item.p.desc.toLowerCase().indexOf(termo) > -1;
    var matchesAba = paletaAba === 'todos' || favoritos[item.i];
    return matchesTermo && matchesAba;
  });
  var listEl = document.getElementById('paletaList');
  if(!listEl) return;
  if(lista.length === 0){
    listEl.innerHTML = '<p class="empty-state">Nenhuma paleta encontrada.</p>';
    return;
  }
  listEl.innerHTML = lista.map(function(item){
    var num = String(item.i + 1).padStart(2, '0');
    var isFav = !!favoritos[item.i];
    return '<div class="palette-row">' +
      '<span class="palette-row-num">' + num + '</span>' +
      '<span class="palette-row-swatches">' + item.p.colors.map(function(c){ return '<span class="swatch-dot" style="background:' + c + ';"></span>'; }).join('') + '</span>' +
      '<span class="palette-row-body">' +
        '<span class="palette-row-name" style="display:block;">' + item.p.name + '</span>' +
        '<span class="palette-row-desc">' + item.p.desc + '</span>' +
      '</span>' +
      '<button class="fav-star ' + (isFav ? 'active' : '') + '" data-fav="' + item.i + '">' + (isFav ? '★' : '☆') + '</button>' +
    '</div>';
  }).join('');
  listEl.querySelectorAll('[data-fav]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = btn.getAttribute('data-fav');
      favoritos[idx] = !favoritos[idx];
      renderPaletaList();
    });
  });
}

/* ================= View-specific bindings ================= */
function bindView(id){
  if(id === 'inicio') bindInicio();
  if(id === 'aprender'){
    document.querySelectorAll('[data-module]').forEach(function(el){
      el.addEventListener('click', function(){
        currentModuleIndex = parseInt(el.getAttribute('data-module'), 10);
        currentView = 'moduleDetail';
        var content = document.getElementById('content');
        content.innerHTML = VIEWS.moduleDetail();
        window.scrollTo({top:0, behavior:'instant'});
      });
    });
  }
  if(id === 'erros'){
    document.querySelectorAll('.faq-item').forEach(function(item){
      var q = item.querySelector('.faq-q');
      var a = item.querySelector('.faq-a');
      q.addEventListener('click', function(){
        var isOpen = item.classList.contains('open');
        document.querySelectorAll('.faq-item').forEach(function(other){
          other.classList.remove('open');
          other.querySelector('.faq-a').style.maxHeight = null;
        });
        if(!isOpen){
          item.classList.add('open');
          a.style.maxHeight = a.scrollHeight + 'px';
        }
      });
    });
  }
  if(id === 'moldes'){
    renderMoldesGrid();
    document.getElementById('moldeSearch').addEventListener('input', function(e){
      moldesFiltro = e.target.value;
      renderMoldesGrid();
    });
    document.querySelectorAll('[data-cat]').forEach(function(chip){
      chip.addEventListener('click', function(){
        moldesCategoria = chip.getAttribute('data-cat');
        document.querySelectorAll('[data-cat]').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        renderMoldesGrid();
      });
    });
  }
  if(id === 'paletas'){
    renderPaletaList();
    document.getElementById('paletaSearch').addEventListener('input', function(e){
      paletaFiltro = e.target.value;
      renderPaletaList();
    });
    document.querySelectorAll('[data-aba]').forEach(function(chip){
      chip.addEventListener('click', function(){
        paletaAba = chip.getAttribute('data-aba');
        document.querySelectorAll('[data-aba]').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        renderPaletaList();
      });
    });
  }
}
